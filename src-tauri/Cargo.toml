[package]
name = "swan_vault_recovery_assistant"
version = "0.1.6"
description = "The world's simplest graphical bitcoin tool"
authors = ["turkycat", "moneymanolis"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "swan_vault_recovery_assistant_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
bdk_electrum = "0.20.1"
bdk_wallet = "1.0.0"
bitcoin-units = "0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
specta = "=2.0.0-rc.20"
specta-typescript = "0.0.7"
tauri = { version = "2.8.2", features = [] }
tauri-plugin-clipboard-manager = "2.3.0"
tauri-plugin-shell = "2"
tauri-specta = { version = "=2.0.0-rc.20", features = ["derive", "typescript"] }
tokio = { version = "1.40.0", features = ["full"] }

[features]
# this feature is used for production builds or when `devPath` points to the filesystem DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
