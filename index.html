<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tempura</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="container">
      <h1>tempura</h1>
      <div class="logo-container">
        <img id="bitcoin-logo" src="./bitcoin.png" alt="tempura logo" />
      </div>

      <form class="row" id="descriptor-form">
        <table>
          <tr>
            <td>
              <input id="receive-input" placeholder="receive descriptor..." />
              <input id="change-input" placeholder="(optional) change descriptor..." />
              <button type="submit">Fetch Balance</button>
            </td>
          </tr>
          <tr>
            <td>
              <input id="electrum-input" placeholder="(optional) custom electrum server" />
              <input type="radio" name="network" value="bitcoin" checked>Bitcoin</input>
              <input type="radio" name="network" value="testnet">Testnet</input>
              <input type="radio" name="network" value="regtest">Regtest</input>
            </td>
          </tr>
        </table>
      </form>

      

      <p id="balance-msg"></p>
    </div>
  </body>
</html>
