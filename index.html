<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tempura</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="root" class="flex flex-grow p-4 gap-8">
      <div class="flex-col w-2/6">
        <div class="font-bold w-full text-center mb-3">tempura</div>
        <img class="size-20 mx-auto" id="bitcoin-logo" src="./bitcoin.png" alt="tempura logo" />
        <div class="font-bold mt-10"><p id="message"></p></div>
      </div>

      <form id="descriptor-form" class="flex-col">
        <div class="mb-3">
          <input class="input-default w-full" id="receive-input" placeholder="receive descriptor..." />
        </div>
        <div class="mb-3">
          <input class="input-default w-full" id="change-input" placeholder="(optional) change descriptor..." />
        </div>
        <div role="group" class="mb-5">
          <button type="button" class="btn btn-default" id="fetch-balance-button">Fetch Balance</button>
          <button type="button" class="btn btn-default" id="new-address-button">New Address</button>
        </div>
        <div class="mb-3">
          <input class="input-default w-full" id="electrum-input" placeholder="(optional) custom electrum server" />
        </div>
        <div class="mb-5">
          <span class="label-default">Network:</span>
          <input id="bitcoin" value="bitcoin" type="radio" name="network" checked /><label
            class="label-default"
            for="bitcoin"
            >Bitcoin</label
          >
          <input id="testnet" value="testnet" type="radio" name="network" /><label class="label-default" for="testnet"
            >Testnet</label
          >
          <input id="regtest" value="regtest" type="radio" name="network" /><label class="label-default" for="regtest"
            >Regtest</label
          >
        </div>
        <div class="mb-3">
          <input class="input-default w-full" id="address-input" placeholder="destination address" />
        </div>
        <div class="mb-5">
          <input class="input-default w-3/12 inline-flex" id="feerate-input" type="number" placeholder="fee rate" min="5" />
          <label class="label-default inline-flex" for="feerate-input">sats/vB (satoshis per virtual byte)</label>
        </div>
        <div class="mb-5">
          <button class="btn btn-default" type="button" id="sweep-button">Create sweep PSBT</button>
        </div>
        <div class="mb-3">
          <textarea class="input-default w-full h-40" id="psbt-textarea" placeholder="psbt..." wrap="soft"></textarea>
        </div>
        <div class="mb-5" role="group">
          <button class="btn btn-default" type="button" id="copy-psbt-button">Copy PSBT to clipboard</button>
          <button class="btn btn-default" type="button" id="paste-psbt-button">Paste PSBT from clipboard</button>
        </div>
        <div class="mb-5" role="group">
          <button class="btn btn-default" type="button" id="enumerate-button">Check Devices</button>
          <button class="btn btn-destructive" type="button" id="sign-message-button">Sign</button>
          <button class="btn btn-destructive" type="button" id="broadcast-button">Broadcast</button>
        </div>
      </form>
    </div>
  </body>
</html>
