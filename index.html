<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tempura</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div id="root" class="flex flex-grow p-4 gap-8">
      <div class="flex-col w-2/6">
        <div class="font-bold w-full text-center mb-3">tempura</div>
        <img class="size-20 mx-auto" id="bitcoin-logo" src="./bitcoin.png" alt="tempura logo" />
        <div class="font-bold mt-10"><p id="message"></p></div>
      </div>

      <form id="descriptor-form" class="flex-col">
        <div class="mb-3">
          <input class="w-full" id="receive-input" type="text" placeholder="receive descriptor..." />
        </div>
        <div class="mb-3">
          <input class="w-full" id="change-input" type="text" placeholder="(optional) change descriptor..." />
        </div>
        <div role="group" class="mb-5">
          <button type="button" class="btn-default" id="fetch-balance-button">Fetch Balance</button>
          <button type="button" class="btn-default" id="new-address-button">New Address</button>
        </div>
        <div class="mb-3">
          <input class="w-full" id="electrum-input" type="text" placeholder="(optional) custom electrum server" />
        </div>
        <div class="mb-5">
          <span class="label-default">Network:</span>
          <input id="bitcoin" value="bitcoin" type="radio" name="network" checked /><label
            class="label-default"
            for="bitcoin"
            >Bitcoin</label
          >
          <input id="testnet" value="testnet" type="radio" name="network" /><label class="label-default" for="testnet"
            >Testnet</label
          >
          <input id="regtest" value="regtest" type="radio" name="network" /><label class="label-default" for="regtest"
            >Regtest</label
          >
        </div>
        <div class="mb-3">
          <input class="w-full" id="address-input" type="text" placeholder="destination address" />
        </div>
        <div id="fee-div" class="mb-5 flex items-center">
          <input
            class="input-default w-2/3 inline-flex"
            id="feerate-input"
            type="number"
            step="0.01"
            placeholder="(optional) fee rate sats/vB"
            min="5"
          />
          <button class="btn-default w-1/3" type="button" id="estimate-button">Suggest A Fee</button>
        </div>
        <div class="mb-5">
          <button class="btn-default" type="button" id="sweep-button">Create Sweep PSBT</button>
        </div>
        <div class="mb-3">
          <textarea class="w-full h-40" id="psbt-textarea" placeholder="psbt..." wrap="soft"></textarea>
        </div>
        <div class="mb-5" role="group">
          <button class="btn-default" type="button" id="copy-psbt-button">Copy PSBT to clipboard</button>
          <button class="btn-default" type="button" id="paste-psbt-button">Paste PSBT from clipboard</button>
        </div>
        <div class="mb-5" role="group">
          <button class="btn-default" type="button" id="enumerate-button">Check Devices</button>
          <button class="btn-warning" type="button" id="sign-message-button">Sign</button>
          <button class="btn-destructive" type="button" id="broadcast-button">Broadcast</button>
        </div>
      </form>
    </div>
  </body>
</html>
