networks:
  tempura-net:
    name: tempura-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.1.0/24

services:
  tempura-bitcoind:
    container_name: tempura-bitcoind
    image: ruimarinho/bitcoin-core:23
    restart: always
    ports:
      - 18453:18443
      - 18454:18444
    networks:
      - tempura-net
    command: [
        '-printtoconsole',
        '-regtest',
        '-listen',
        '-txindex',
        '-fallbackfee=0.0002', # 20 sats per byte
        '-rpcallowip=172.50.1.0/24',
        '-rpcbind=tempura-bitcoind',
        '-rpcbind=127.0.0.1',
        '-rpcuser=tempura',
        '-rpcpassword=hunter2',
      ]

  tempura-fulcrum:
    container_name: tempura-fulcrum
    image: cculianu/fulcrum
    restart: always
    depends_on:
      - tempura-bitcoind
    ports:
      - 50021:50001
    networks:
      - tempura-net
    command: ['Fulcrum', '-t', '0.0.0.0:50001', '-b', 'tempura-bitcoind:18443', '-u', 'tempura', '-p', 'hunter2']
