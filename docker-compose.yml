networks:
  swan-vault-recovery-assistant-net:
    name: swan-vault-recovery-assistant-net
    driver: bridge
    ipam:
      config:
        - subnet: 172.50.1.0/24

services:
  swan-vault-recovery-assistant-bitcoind:
    container_name: swan-vault-recovery-assistant-bitcoind
    image: ruimarinho/bitcoin-core:23
    restart: always
    ports:
      - 18453:18443
      - 18454:18444
    networks:
      - swan-vault-recovery-assistant-net
    command: [
        '-printtoconsole',
        '-regtest',
        '-listen',
        '-txindex',
        '-fallbackfee=0.0002', # 20 sats per byte
        '-rpcallowip=172.50.1.0/24',
        '-rpcbind=swan-vault-recovery-assistant-bitcoind',
        '-rpcbind=127.0.0.1',
        '-rpcuser=swan-vault-recovery-assistant',
        '-rpcpassword=hunter2',
      ]

  swan-vault-recovery-assistant-fulcrum:
    container_name: swan-vault-recovery-assistant-fulcrum
    image: cculianu/fulcrum
    restart: always
    depends_on:
      - swan-vault-recovery-assistant-bitcoind
    ports:
      - 50021:50001
    networks:
      - swan-vault-recovery-assistant-net
    command:
      [
        'Fulcrum',
        '-t',
        '0.0.0.0:50001',
        '-b',
        'swan-vault-recovery-assistant-bitcoind:18443',
        '-u',
        'swan-vault-recovery-assistant',
        '-p',
        'hunter2',
      ]
