name: Build Swan Vault Recovery Assistant release

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  build:
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'tag-approval' || null }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      matrix:
        # https://github.com/actions/runner-images
        # Use ubuntu-22.04 for glibc 2.35 compatibility with Debian 12 (glibc 2.36)
        # Revisit when Debian 12 reaches EOL (~2028) or ubuntu-22.04 is deprecated
        os: [ubuntu-22.04, windows-latest, macos-latest]
        isPR:
          - ${{github.event_name == 'pull_request'}}
        allBundles:
          - ${{contains(github.event.pull_request.labels.*.name, 'all bundles')}}
        exclude:
          - isPR: true
            allBundles: false
            os: ubuntu-22.04
          - isPR: true
            allBundles: false
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Checkout private actions
        uses: actions/checkout@v4
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: Verify Tag is on Master Branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The default checkout is shallow. Fetch the master branch
          # so we can perform the ancestry check.
          git fetch origin master
          # Check if the commit of the tag is an ancestor of the master branch.
          # This prevents building tags from unmerged branches.
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "Error: Tag ${{ github.ref_name }} points to a commit (${{ github.sha }}) that is not on the master branch."
            echo "This is a security risk. Aborting build."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on the master branch. Proceeding."

      - name: Check if tag version matches config files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          TAURI_CONFIG_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PACKAGE_JSON_VERSION=$(jq -r '.version' package.json)
          CARGO_TOML_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)

          if [ "$TAG_VERSION" != "$TAURI_CONFIG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_CONFIG_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PACKAGE_JSON_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_JSON_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_TOML_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_TOML_VERSION)."
            exit 1
          fi

          echo "Tag version ($TAG_VERSION) matches all configuration files."

      - name: Set up Rust
        uses: ./.github/private-actions/actions-rs/toolchain
        with:
          toolchain: stable
          override: true

      - uses: ./.github/private-actions/pnpm/action-setup
        with:
          version: 9
      - uses: ./.github/private-actions/actions/setup-node
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install system dependencies (linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cargo cache
        id: restore-cargo-cache
        uses: ./.github/private-actions/actions/cache/restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/hwi.exe
            !src-tauri/target/release/swan-vault-recovery-assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant.exe
            !src-tauri/target/release/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/build.yml') }}

      - name: Debug cache contents
        shell: bash
        run: |
          echo "=== Checking bundle directory after cache restore ==="
          if [ -d "src-tauri/target/release/bundle" ]; then
            echo "Bundle directory EXISTS after cache restore:"
            ls -alR src-tauri/target/release/bundle/
          else
            echo "Bundle directory does NOT exist after cache restore (expected)"
          fi

      - name: Import Apple Developer Certificate
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Apple Developer Certificate
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
          echo "Apple Developer Certificate imported."

      - name: Save Apple API Key
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          APPLE_API_KEY_PATH=$HOME/apple_api.key
          echo ${APPLE_API_KEY_B64} | base64 -d > $APPLE_API_KEY_PATH
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> $GITHUB_ENV
          echo "Apple API Key saved."

      - name: Build project (signed Mac app)
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm tauri:build

      - name: Build project (unsigned)
        if: ${{ matrix.os != 'macos-latest' || matrix.isPR }}
        run: pnpm tauri:build

      - name: Check for git diffs after build
        run: pnpm ci:gitdiff

      - name: Save cargo cache
        uses: ./.github/private-actions/actions/cache/save
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/hwi.exe
            !src-tauri/target/release/swan-vault-recovery-assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant.exe
            !src-tauri/target/release/bundle
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

        # https://jonaskruckenberg.github.io/tauri-docs-wip/building/building-your-application.html#packaging-formats
      - name: Publish artifacts (linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: ./.github/private-actions/actions/upload-artifact
        with:
          name: swan-vault-recovery-assistant-linux
          path: |
            src-tauri/target/release/bundle/deb/swan*.deb
            src-tauri/target/release/bundle/appimage/swan*.AppImage
            src-tauri/target/release/bundle/rpm/swan*.rpm

      - name: Generate build provenance predicate (linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        id: provenance-predicate-linux
        uses: ./.github/private-actions/actions/attest-build-provenance/predicate

      - name: Generate build provenance attestation (linux)
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        uses: ./.github/private-actions/actions/attest
        with:
          subject-path: |
            src-tauri/target/release/bundle/deb/swan*.deb
            src-tauri/target/release/bundle/appimage/swan*.AppImage
            src-tauri/target/release/bundle/rpm/swan*.rpm
          predicate-type: ${{ steps.provenance-predicate-linux.outputs.predicate-type }}
          predicate: ${{ steps.provenance-predicate-linux.outputs.predicate }}

      - name: Publish artifacts (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        uses: ./.github/private-actions/actions/upload-artifact
        with:
          name: swan-vault-recovery-assistant-macos
          path: |
            src-tauri/target/release/bundle/macos/swan*.app
            src-tauri/target/release/bundle/dmg/swan*.dmg

      - name: Generate build provenance predicate (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        id: provenance-predicate-macos
        uses: ./.github/private-actions/actions/attest-build-provenance/predicate

      - name: Generate build provenance attestation (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        uses: ./.github/private-actions/actions/attest
        with:
          subject-path: |
            src-tauri/target/release/bundle/macos/swan*.app
            src-tauri/target/release/bundle/dmg/swan*.dmg
          predicate-type: ${{ steps.provenance-predicate-macos.outputs.predicate-type }}
          predicate: ${{ steps.provenance-predicate-macos.outputs.predicate }}

      - name: Publish artifacts (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ./.github/private-actions/actions/upload-artifact
        with:
          name: swan-vault-recovery-assistant-windows
          path: |
            src-tauri/target/release/bundle/msi/swan*.msi
            src-tauri/target/release/bundle/nsis/swan*.exe

      - name: Generate build provenance predicate (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        id: provenance-predicate-windows
        uses: ./.github/private-actions/actions/attest-build-provenance/predicate

      - name: Generate build provenance attestation (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: ./.github/private-actions/actions/attest
        with:
          subject-path: |
            src-tauri/target/release/bundle/msi/swan*.msi
            src-tauri/target/release/bundle/nsis/swan*.exe
          predicate-type: ${{ steps.provenance-predicate-windows.outputs.predicate-type }}
          predicate: ${{ steps.provenance-predicate-windows.outputs.predicate }}

  release:
    name: Create GitHub Release
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout private actions
        uses: actions/checkout@v4
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: Download all artifacts
        uses: ./.github/private-actions/actions/download-artifact
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Generate release notes
        id: release_notes
        run: |
          cat << 'EOF' > release_notes.md
          ## Verification

          This release uses [immutable releases](https://docs.github.com/en/repositories/releasing-projects-on-github/about-releases#immutable-releases) and [artifact attestations](https://docs.github.com/en/actions/security-for-github-actions/using-artifact-attestations/using-artifact-attestations-to-establish-provenance-for-builds) to provide cryptographic proof of build provenance.

          **Download artifacts first**, either from this GitHub release page or via CLI:
          ```bash
          # Download a specific asset
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }} --pattern 'swan-vault-recovery-assistant*.dmg'

          # Or download all assets
          gh release download ${{ github.ref_name }} --repo ${{ github.repository }}
          ```

          **Verify Immutable Release:**
          ```bash
          # Verify a specific asset was published via immutable release
          gh release verify-asset swan-vault-recovery-assistant_${{ github.ref_name }}_amd64.AppImage --repo ${{ github.repository }}

          # Or verify all downloaded assets
          for f in swan-vault-recovery-assistant*; do gh release verify-asset "$f" --repo ${{ github.repository }}; done

          # Immutable releases guarantee:
          # - The release was created by an automated workflow, not a human
          # - Release artifacts cannot be modified or replaced after publication
          # - The release is permanently linked to the workflow run that created it
          ```

          **Verify Artifact Attestations:**
          ```bash
          # Verify build provenance attestation for a specific artifact
          gh attestation verify swan-vault-recovery-assistant_${{ github.ref_name }}_amd64.AppImage --repo ${{ github.repository }}

          # Or verify all downloaded assets
          for f in swan-vault-recovery-assistant*; do gh attestation verify "$f" --repo ${{ github.repository }}; done

          # Successful verification confirms:
          # - The artifact was built by GitHub Actions in this repository
          # - The artifact has not been modified since the build
          ```

          For detailed verification instructions, see the [full verification guide](https://github.com/${{ github.repository }}/blob/master/docs/verifying-releases.md).

          ---

          EOF

          echo "Generated release notes"

      - name: Create Draft Release
        id: create_release
        uses: ./.github/private-actions/softprops/action-gh-release
        with:
          body_path: release_notes.md
          generate_release_notes: true
          draft: true
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
          files: |
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.deb
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.AppImage
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.rpm
            artifacts/swan-vault-recovery-assistant-macos/**/swan*.dmg
            artifacts/swan-vault-recovery-assistant-windows/**/swan*.exe
            artifacts/swan-vault-recovery-assistant-windows/**/swan*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        id: publish_release
        uses: ./.github/private-actions/softprops/action-gh-release
        with:
          draft: false
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
