name: Build Swan Vault Recovery Assistant release

on:
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  build:
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'tag-approval' || null }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-latest, windows-latest, macos-latest]
        isPR:
          - ${{github.event_name == 'pull_request'}}
        allBundles:
          - ${{contains(github.event.pull_request.labels.*.name, 'all bundles')}}
        exclude:
          - isPR: true
            allBundles: false
            os: ubuntu-latest
          - isPR: true
            allBundles: false
            os: windows-latest

    steps:
      - name: Checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - name: Verify Tag is on Master Branch
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          # The default checkout is shallow. Fetch the master branch
          # so we can perform the ancestry check.
          git fetch origin master
          # Check if the commit of the tag is an ancestor of the master branch.
          # This prevents building tags from unmerged branches.
          if ! git merge-base --is-ancestor ${{ github.sha }} origin/master; then
            echo "Error: Tag ${{ github.ref_name }} points to a commit (${{ github.sha }}) that is not on the master branch."
            echo "This is a security risk. Aborting build."
            exit 1
          fi
          echo "Tag ${{ github.ref_name }} is on the master branch. Proceeding."

      - name: Check if tag version matches config files
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION=$(echo "${{ github.ref }}" | sed 's/refs\/tags\/v//')
          TAURI_CONFIG_VERSION=$(jq -r '.version' src-tauri/tauri.conf.json)
          PACKAGE_JSON_VERSION=$(jq -r '.version' package.json)
          CARGO_TOML_VERSION=$(grep '^version = ' src-tauri/Cargo.toml | cut -d '"' -f 2)

          if [ "$TAG_VERSION" != "$TAURI_CONFIG_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match tauri.conf.json version ($TAURI_CONFIG_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$PACKAGE_JSON_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_JSON_VERSION)."
            exit 1
          fi

          if [ "$TAG_VERSION" != "$CARGO_TOML_VERSION" ]; then
            echo "Error: Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_TOML_VERSION)."
            exit 1
          fi

          echo "Tag version ($TAG_VERSION) matches all configuration files."

      - name: Set up Rust
        uses: swan-bitcoin/actions/actions-rs/toolchain@master
        with:
          toolchain: stable
          override: true

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9
      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install system dependencies (linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cargo cache
        id: restore-cargo-cache
        uses: swan-bitcoin/actions/actions/cache/restore@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/hwi.exe
            !src-tauri/target/release/swan-vault-recovery-assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant.exe
            !src-tauri/target/release/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/build.yml') }}

      - name: Debug cache contents
        run: |
          echo "=== Checking bundle directory after cache restore ==="
          if [ -d "src-tauri/target/release/bundle" ]; then
            echo "Bundle directory EXISTS after cache restore:"
            ls -alR src-tauri/target/release/bundle/
          else
            echo "Bundle directory does NOT exist after cache restore (expected)"
          fi

      - name: Import Apple Developer Certificate
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security find-identity -v -p codesigning build.keychain

      - name: Verify Apple Developer Certificate
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "APPLE_SIGNING_IDENTITY=$CERT_ID" >> $GITHUB_ENV
          echo "Apple Developer Certificate imported."

      - name: Save Apple API Key
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
        run: |
          APPLE_API_KEY_PATH=$HOME/apple_api.key
          echo ${APPLE_API_KEY_B64} | base64 -d > $APPLE_API_KEY_PATH
          echo "APPLE_API_KEY_PATH=$APPLE_API_KEY_PATH" >> $GITHUB_ENV
          echo "Apple API Key saved."

      - name: Build project (signed Mac app)
        if: ${{ matrix.os == 'macos-latest' && !matrix.isPR }}
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: pnpm tauri:build

      - name: Build project (unsigned)
        if: ${{ matrix.os != 'macos-latest' || matrix.isPR }}
        run: pnpm tauri:build

      - name: Check for git diffs after build
        run: pnpm ci:gitdiff

      - name: Save cargo cache
        uses: swan-bitcoin/actions/actions/cache/save@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/hwi.exe
            !src-tauri/target/release/swan-vault-recovery-assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant
            !src-tauri/target/release/Swan Vault Recovery Assistant.exe
            !src-tauri/target/release/bundle
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

        # https://jonaskruckenberg.github.io/tauri-docs-wip/building/building-your-application.html#packaging-formats
      - name: Publish artifacts (linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: swan-bitcoin/actions/actions/upload-artifact@master
        with:
          name: swan-vault-recovery-assistant-linux
          path: |
            src-tauri/target/release/bundle/deb/swan*.deb
            src-tauri/target/release/bundle/appimage/swan*.AppImage
            src-tauri/target/release/bundle/rpm/swan*.rpm

      - name: Publish artifacts (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        uses: swan-bitcoin/actions/actions/upload-artifact@master
        with:
          name: swan-vault-recovery-assistant-macos
          path: |
            src-tauri/target/release/bundle/macos/swan*.app
            src-tauri/target/release/bundle/dmg/swan*.dmg

      - name: Publish artifacts (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: swan-bitcoin/actions/actions/upload-artifact@master
        with:
          name: swan-vault-recovery-assistant-windows
          path: |
            src-tauri/target/release/bundle/msi/swan*.msi
            src-tauri/target/release/bundle/nsis/swan*.exe

  release:
    name: Create GitHub Release
    needs: build
    if: success() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: swan-bitcoin/actions/actions/download-artifact@master
        with:
          path: artifacts

      - name: List artifacts
        run: ls -R artifacts

      - name: Create Release and Upload Artifacts
        uses: swan-bitcoin/actions/softprops/action-gh-release@master
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.deb
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.AppImage
            artifacts/swan-vault-recovery-assistant-linux/**/swan*.rpm
            artifacts/swan-vault-recovery-assistant-macos/**/swan*.dmg
            artifacts/swan-vault-recovery-assistant-windows/**/swan*.exe
            artifacts/swan-vault-recovery-assistant-windows/**/swan*.msi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
