name: Build tempura release

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, labeled]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # https://github.com/actions/runner-images
        os: [ubuntu-latest, windows-latest, macos-latest]
        isPR:
          - ${{github.event_name == 'pull_request'}}
        allBundles:
          - ${{github.event.label.name == 'all bundles'}}
        exclude:
          - isPR: true
            allBundles: false
            os: ubuntu-latest
          - isPR: true
            allBundles: false
            os: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install system dependencies (linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore cargo cache
        id: restore-cargo-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/bundle
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/build.yml') }}

      - name: Build project
        run: pnpm tauri build

      - name: Check for git diffs after build
        run: pnpm ci:gitdiff

      - name: Save cargo cache
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/bundle
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

        # https://jonaskruckenberg.github.io/tauri-docs-wip/building/building-your-application.html#packaging-formats
      - name: Publish artifacts (linux)
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: tempura-linux
          path: |
            src-tauri/target/release/bundle/deb/tempura*.deb
            src-tauri/target/release/bundle/appimage/tempura*.AppImage
            src-tauri/target/release/bundle/rpm/tempura*.rpm

      - name: Publish artifacts (macos)
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: tempura-macos
          path: |
            src-tauri/target/release/bundle/macos/tempura.app
            src-tauri/target/release/bundle/dmg/tempura*.dmg

      - name: Publish artifacts (windows)
        if: ${{ matrix.os == 'windows-latest' }}
        uses: actions/upload-artifact@v4
        with:
          name: tempura-windows
          path: |
            src-tauri/target/release/bundle/msi/tempura*.msi
            src-tauri/target/release/bundle/nsis/tempura*.exe
