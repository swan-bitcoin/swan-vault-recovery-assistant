name: Automated Tests

# Controls when the workflow will run
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: Debug token access
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
        run: |
          echo "Token length: ${#GH_TOKEN}"
          if [ -z "$GH_TOKEN" ]; then
            echo "ERROR: Token is empty!"
            exit 1
          fi
          echo "Testing API access to swan-bitcoin/actions..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_TOKEN" https://api.github.com/repos/swan-bitcoin/actions)
          echo "HTTP response code: $HTTP_CODE"
          case $HTTP_CODE in
            200) echo "✓ Token has access to the repo" ;;
            404) echo "✗ 404 - No permission or repo doesn't exist" ;;
            401) echo "✗ 401 - Token is invalid/expired" ;;
            403) echo "✗ 403 - Token lacks required scopes" ;;
            *) echo "✗ Unexpected: $HTTP_CODE" ;;
          esac

      - name: checkout private actions
        uses: actions/checkout@v4
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: set up rust
        uses: ./.github/private-actions/actions-rs/toolchain
        with:
          toolchain: stable
          override: true

      - uses: ./.github/private-actions/pnpm/action-setup
        with:
          version: 9

      - uses: ./.github/private-actions/actions/setup-node
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: run unit tests
        run: pnpm test:unit

  scenario-test:
    name: scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4

      - name: checkout private actions
        uses: actions/checkout@v4
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: set up rust
        uses: ./.github/private-actions/actions-rs/toolchain
        with:
          toolchain: stable
          override: true

      - uses: ./.github/private-actions/pnpm/action-setup
        with:
          version: 9

      - uses: ./.github/private-actions/actions/setup-node
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install system dependencies (linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install addl dependencies for scenario tests
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: install project dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: restore cargo cache
        id: restore-cargo-cache
        uses: ./.github/private-actions/actions/cache/restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/test.yml') }}

      - name: install the tauri driver if necessary
        run: |
          if ! command -v tauri-driver &> /dev/null; then
            cargo install tauri-driver
          fi

      - name: build Swan Vault Recovery Assistant
        run: pnpm tauri build --no-bundle

      - name: save cargo cache
        uses: ./.github/private-actions/actions/cache/save
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

      - name: run the tests
        run: SVRA_SCENARIO_SKIP_BUILD=1 xvfb-run -a pnpm test:scenario
