name: Automated Tests

# Controls when the workflow will run
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: checkout private actions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: set up rust
        uses: ./.github/private-actions/actions-rs/toolchain
        with:
          toolchain: stable
          override: true

      - uses: ./.github/private-actions/pnpm/action-setup
        # Version is pinned via package.json `packageManager` (integrity-
        # hash verified). pnpm/action-setup refuses to start if both
        # `version:` and `packageManager` are specified.

      - uses: ./.github/private-actions/actions/setup-node
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install dependencies
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: run unit tests
        run: pnpm test:unit

  scenario-test:
    name: scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: checkout private actions
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: set up rust
        uses: ./.github/private-actions/actions-rs/toolchain
        with:
          toolchain: stable
          override: true

      - uses: ./.github/private-actions/pnpm/action-setup
        # Version is pinned via package.json `packageManager` (integrity-
        # hash verified). pnpm/action-setup refuses to start if both
        # `version:` and `packageManager` are specified.

      - uses: ./.github/private-actions/actions/setup-node
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install system dependencies (linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install addl dependencies for scenario tests
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: install project dependencies
        # HUSKY=0 keeps husky from trying to install git hooks in CI.
        # `.npmrc` sets `ignore-scripts=true` so no dependency lifecycle
        # scripts run during install.
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile

      - name: fetch HWI binary
        # Previously ran implicitly via the package.json `postinstall` script.
        # Moved to an explicit step because `.npmrc` now sets
        # `ignore-scripts=true`. The fetch script SHA-256 verifies the
        # downloaded binary against scripts/hwi.json. Required because
        # `tauri build` below produces an artifact that bundles HWI.
        run: pnpm run fetch:hwi

      - name: restore cargo cache
        id: restore-cargo-cache
        uses: ./.github/private-actions/actions/cache/restore
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/test.yml') }}

      - name: install the tauri driver if necessary
        run: |
          if ! command -v tauri-driver &> /dev/null; then
            cargo install tauri-driver
          fi

      - name: build Swan Vault Recovery Assistant
        run: pnpm tauri build --no-bundle

      - name: save cargo cache
        uses: ./.github/private-actions/actions/cache/save
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

      - name: run the tests
        run: SVRA_SCENARIO_SKIP_BUILD=1 xvfb-run -a pnpm test:scenario
