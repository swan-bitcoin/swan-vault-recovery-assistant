name: Automated Tests

# Controls when the workflow will run
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - name: set up rust
        uses: swan-bitcoin/actions/actions-rs/toolchain@master
        with:
          toolchain: stable
          override: true

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9

      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: run unit tests
        run: pnpm test:unit

  scenario-test:
    name: scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - name: set up rust
        uses: swan-bitcoin/actions/actions-rs/toolchain@master
        with:
          toolchain: stable
          override: true

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9

      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install system dependencies (linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install addl dependencies for scenario tests
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: install project dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: restore cargo cache
        id: restore-cargo-cache
        uses: swan-bitcoin/actions/actions/cache/restore@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/tempura
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/test.yml') }}

      - name: install the tauri driver if necessary
        run: |
          if ! command -v tauri-driver &> /dev/null; then
            cargo install tauri-driver
          fi

      - name: build tempura
        run: pnpm tauri build --no-bundle

      - name: save cargo cache
        uses: swan-bitcoin/actions/actions/cache/save@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/tempura
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

      - name: run the tests
        run: TEMPURA_SCENARIO_SKIP_BUILD=1 xvfb-run -a pnpm test:scenario
