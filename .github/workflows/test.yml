name: Automated Tests

# Controls when the workflow will run
on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

jobs:
  unit-test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - name: set up rust
        uses: swan-bitcoin/actions/actions-rs/toolchain@master
        with:
          toolchain: stable
          override: true

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9

      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: run unit tests
        run: pnpm test:unit

  scenario-test:
    name: scenario tests
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - name: set up rust
        uses: swan-bitcoin/actions/actions-rs/toolchain@master
        with:
          toolchain: stable
          override: true

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9

      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install system dependencies (linux)
        run: sudo apt-get update && sudo apt-get install -y build-essential curl wget file libwebkit2gtk-4.1-dev libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: install addl dependencies for scenario tests
        run: sudo apt-get install -y webkit2gtk-driver xvfb

      - name: install project dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: restore cargo cache
        id: restore-cargo-cache
        uses: swan-bitcoin/actions/actions/cache/restore@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '.github/workflows/test.yml') }}

      - name: install the tauri driver if necessary
        run: |
          if ! command -v tauri-driver &> /dev/null; then
            cargo install tauri-driver
          fi

      - name: build Swan Vault Recovery Assistant
        run: pnpm tauri build --no-bundle

      - name: save cargo cache
        uses: swan-bitcoin/actions/actions/cache/save@master
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
            !src-tauri/target/release/hwi
            !src-tauri/target/release/swan_vault_recovery_assistant
          key: ${{ steps.restore-cargo-cache.outputs.cache-primary-key }}

      - name: run the tests
        run: SVRA_SCENARIO_SKIP_BUILD=1 xvfb-run -a pnpm test:scenario

  macos-signing-test:
    name: macOS HWI signing verification
    runs-on: macos-latest
    steps:
      - name: checkout code
        uses: swan-bitcoin/actions/actions/checkout@master

      - uses: swan-bitcoin/actions/pnpm/action-setup@master
        with:
          version: 9

      - uses: swan-bitcoin/actions/actions/setup-node@master
        with:
          node-version: 20
          cache: 'pnpm'

      - name: install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: verify HWI binary exists
        run: |
          if [ ! -f "src-tauri/hwi-aarch64-apple-darwin" ]; then
            echo "❌ HWI binary not found after install"
            exit 1
          fi
          echo "✓ HWI binary found"

      - name: verify entitlements file exists
        run: |
          if [ ! -f "src-tauri/hwi-entitlements.plist" ]; then
            echo "❌ hwi-entitlements.plist not found"
            exit 1
          fi
          echo "✓ Entitlements file found"

      - name: verify entitlements content
        run: |
          if ! grep -q "disable-library-validation" src-tauri/hwi-entitlements.plist; then
            echo "❌ disable-library-validation not found in entitlements"
            exit 1
          fi
          echo "✓ disable-library-validation entitlement present in file"

      - name: create ad-hoc signed test binary
        run: |
          # Test signing with ad-hoc signature (no certificate needed)
          echo "Testing signing with entitlements (ad-hoc)..."
          cp src-tauri/hwi-aarch64-apple-darwin /tmp/hwi-test
          codesign --force \
            --sign - \
            --options runtime \
            --entitlements src-tauri/hwi-entitlements.plist \
            /tmp/hwi-test

      - name: verify test binary signature
        run: |
          echo "Verifying test binary..."

          # Verify signature is valid
          if ! codesign --verify --verbose /tmp/hwi-test 2>&1; then
            echo "❌ Signature verification failed"
            exit 1
          fi
          echo "✓ Signature is valid"

          # Verify entitlements were applied
          if ! codesign -d --entitlements - /tmp/hwi-test 2>&1 | grep -q "disable-library-validation"; then
            echo "❌ disable-library-validation entitlement not found in signed binary"
            exit 1
          fi
          echo "✓ disable-library-validation entitlement present in signed binary"

          echo "✅ macOS HWI signing verification passed"
