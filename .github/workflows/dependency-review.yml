# Dependency Review Action
#
# This Action will scan dependency manifest files that change as part of a Pull Request,
# surfacing known-vulnerable versions of the packages declared or updated in the PR.
# Once installed, if the workflow run is marked as required, PRs introducing known-vulnerable
# packages will be blocked from merging.
#
# Source repository: https://github.com/actions/dependency-review-action
# Public documentation: https://docs.github.com/en/code-security/supply-chain-security/understanding-your-software-supply-chain/about-dependency-review#dependency-review-enforcement
name: 'Dependency review'
on:
  pull_request:
    branches: ['master']

permissions:
  contents: read
  # Write permissions for pull-requests are required for using the `comment-summary-in-pr` option, comment out if you aren't using this option
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout repository'
        uses: actions/checkout@v4

      - name: 'Checkout private actions'
        uses: actions/checkout@v4
        with:
          repository: swan-bitcoin/actions
          ref: master
          token: ${{ secrets.GH_PAT_ACTIONS_ACCESS }}
          path: .github/private-actions

      - name: 'Dependency Review'
        uses: ./.github/private-actions/actions/dependency-review-action
        # Commonly enabled options, see https://github.com/actions/dependency-review-action#configuration-options for all available options.
        with:
          comment-summary-in-pr: on-failure
          license-check: false
          fail-on-severity: high

  # NOTE: An `analyze-dependency-changes` job lived here, added in PR #177 (PSEC-4882)
  # and reverted in PSEC-4907 because the `swan/analyze-dependencies` composite contains
  # transitive `uses: swan-bitcoin/actions/...@<sha>` self-refs that this public repo's
  # GITHUB_TOKEN cannot resolve. The PAT used for the outer `actions/checkout` step does
  # not propagate to transitive action resolution at workflow-prep time, so the job was
  # dead-on-arrival. See PSEC-4894 for the systematic fix (Option C′ — teach `sync-actions`
  # to emit SHA-pinned upstream refs for `public-safe`-tagged composites). PSEC-4912
  # tracks re-adding this job once that lands.
